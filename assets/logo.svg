<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
  </defs>

  <!-- Bridge arc representing the proxy/middleware -->
  <path d="M 28 78 Q 60 32 100 44 Q 140 56 180 48 Q 220 40 260 52 Q 300 64 340 50 Q 360 44 372 60"
        fill="none" stroke="url(#bridge)" stroke-width="5" stroke-linecap="round"/>

  <!-- Left pillar: Claude Code client -->
  <rect x="20" y="60" width="24" height="32" rx="6" fill="#7c3aed" opacity="0.9"/>
  <text x="32" y="82" font-family="monospace" font-size="11" fill="white" text-anchor="middle" font-weight="bold">CC</text>

  <!-- Center proxy node (the middleware) -->
  <circle cx="160" cy="20" r="14" fill="#0891b2"/>
  <text x="160" y="25" font-family="monospace" font-size="10" fill="white" text-anchor="middle" font-weight="bold">FCC</text>

  <!-- Right pillar: Providers (multiple) -->
  <rect x="340" y="54" width="22" height="28" rx="5" fill="#16a34a" opacity="0.85"/>
  <rect x="358" y="58" width="22" height="28" rx="5" fill="#16a34a" opacity="0.7"/>
  <rect x="370" y="62" width="22" height="28" rx="5" fill="#16a34a" opacity="0.55"/>
  <text x="376" y="78" font-family="monospace" font-size="7" fill="white" text-anchor="middle" font-weight="bold">AI</text>

  <!-- Text -->
  <text x="200" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#172033" text-anchor="middle" font-weight="700" letter-spacing="1">Free Claude Code</text>
</svg>